// ==========================================
// WarMod Manager 2.0.0 - Configuration File
// Author: woobbie | https://github.com/Woobb1e
// Target: Counter-Strike: Source v34 (SourceMod 1.11)
// Auto-generated via AutoExecConfig - edit and reload via `exec warmod/warmod_manager.cfg`
// ==========================================

// ======================================================================
// Match Flow - Controls core competitive flow, halftime and ready prompts
// ======================================================================

// wm_stop_min_players - Minimum players required to keep a live match running.
//   If active players drop below this, the match is cancelled via `cm`.
//   Valid: 0 - 64 | <2 disables the check | Default: "4"
wm_stop_min_players "4"

// wm_autohalf_forcestart - Halftime auto-start behaviour.
//   0 = disabled, 1 = force only when ready players == in-teams, 2 = force when ready >= wm_min_ready, 3 = force after swap delay.
//   Valid: 0 - 3 | Default: "2"
wm_autohalf_forcestart "2"

// wm_endmatch_votemap - Start MapChooser vote at match end.
//   0 = disabled, 1 = enabled (calls InitiateMapChooserVote).
//   Valid: 0 / 1 | Default: "1"
wm_endmatch_votemap "1"

// wm_readysystem_askmenu - Show ready confirmation panel to unready players.
//   0 = disabled (silent), 1 = send Yes/No panel (Are you ready to the match?).
//   Valid: 0 / 1 | Default: "1"
wm_readysystem_askmenu "1"


// ======================================================================
// Captains System - Draft, duel and Lasts prevention
// ======================================================================

// wm_captains_enable - Enable captains draft mode.
//   When waiting and >= wm_min_ready players, moves non-captains to spec and starts duel.
//   Valid: 0 / 1 | Default: "1"
wm_captains_enable "1"

// wm_captains_auto_select_time - Seconds to wait for manual captain pick before auto-select.
//   Randomly picks two specs (excluding Lasts). 0 = disabled, 1 = instant.
//   Valid: 0 - 60 | Default: "30"
wm_captains_auto_select_time "30"

// wm_captains_watermelon_throw - Easter egg: spectators throw watermelons during duel.
//   Spawns prop_physics watermelon01.mdl at 1750 u/s with touch damage 40-50.
//   Valid: 0 / 1 | Default: "0"
wm_captains_watermelon_throw "0"

// wm_lasts_system_enable - Enable Lasts system (players from previous match marked as Last).
//   Marked players are disabled in draft menu and cannot be captain.
//   Valid: 0 / 1 | Default: "1"
wm_lasts_system_enable "1"

// wm_lasts_system_immunity - Allow admins to bypass Lasts restriction.
//   0 = no immunity, 1 = admins matching wm_admin_immunity_flag are not marked Last.
//   Valid: 0 / 1 | Default: "1"
wm_lasts_system_immunity "1"

// wm_admin_immunity_flag - Admin flag required for Lasts and ban immunity.
//   Empty = any admin, "0" = disable immunity, otherwise flag string (e.g. "b").
//   Valid: flag string | Default: "b"
wm_admin_immunity_flag "b"


// ======================================================================
// Anti-Leaver & Bans - Grace period and escalating SourceBans punishments
// ======================================================================

// wm_ban_disconnected - Ban players who disconnect during a live match.
//   0 = no ban, 1 = start grace timer and ban if not reconnected/replaced.
//   Valid: 0 / 1 | Default: "1"
wm_ban_disconnected "1"

// wm_ban_in - Grace period before ban is executed (seconds).
//   Player can reconnect or be replaced via !ask within this window.
//   Valid: 0+ seconds | Default: "120"
wm_ban_in "120"

// wm_ban_time - Base ban duration for first leave (minutes).
//   Used when no prior leaves within reset window or without SourceBans.
//   Valid: 0+ minutes | Default: "1440" (1 day)
wm_ban_time "1440"

// wm_ban_time_extend - Extra ban time added for each prior leave within reset window (minutes).
//   Requires SourceBans DB. Escalating: base + extend * count.
//   Valid: 0+ minutes | Default: "1440"
wm_ban_time_extend "1440"

// wm_ban_count_reset_in - Hours after which prior ban count resets (no extension).
//   Only leaves within this window count towards escalation.
//   Valid: 1+ hours | Default: "168" (7 days)
wm_ban_count_reset_in "168"

// wm_ban_announce - Announce bans in chat using "Banned" phrase.
//   0 = silent (log only), 1 = PrintToChatAll.
//   Valid: 0 / 1 | Default: "1"
wm_ban_announce "1"

// wm_ban_admins_immunity - Exempt admins from leaver bans.
//   0 = admins can be banned, 1 = admins matching flag are immune.
//   Valid: 0 / 1 | Default: "1"
wm_ban_admins_immunity "1"


// ======================================================================
// Replacements - Spectator substitution to avoid bans
// ======================================================================

// wm_allow_replacements - Allow a disconnected player to avoid ban if replaced.
//   0 = replacement still banned, 1 = replaced player is pardoned.
//   Valid: 0 / 1 | Default: "1"
wm_allow_replacements "1"

// wm_auto_replacements - Automatically replace leaver with first spectator (no !ask needed).
//   0 = manual !ask only, 1 = auto-clone state to spectator.
//   Valid: 0 / 1 | Default: "0"
wm_auto_replacements "0"

// wm_replace_allow_ask - Allow alive players to request a spectator replacement via !ask.
//   0 = disabled, 1 = show SelectSpectator menu and Ask panel.
//   Valid: 0 / 1 | Default: "1"
wm_replace_allow_ask "1"

// wm_replace_ask_command - Chat trigger for replacement request (without ! / . / prefix).
//   Players type !ask, .ask or /ask.
//   Valid: string | Default: "ask"
wm_replace_ask_command "ask"


// ======================================================================
// Hostname & VoteStop - Server branding and match cancellation vote
// ======================================================================

// wm_match_hostname_info - Dynamically append match state to hostname.
//   Shows [Waiting for Players], [Live: X-Y] or [Overtime: X-Y].
//   Valid: 0 / 1 | Default: "1"
wm_match_hostname_info "1"

// wm_match_votestop - Enable !stop vote to cancel a live match.
//   0 = disabled, 1 = players can vote via !stop/.stop.
//   Valid: 0 / 1 | Default: "1"
wm_match_votestop "1"

// wm_match_votestop_needed - Fraction of voters required to pass votestop.
//   Calculated as floor(Voters * value), at least 1.
//   Valid: 0.05 - 1.0 | Default: "0.60" (60%)
wm_match_votestop_needed "0.60"

// wm_match_votestop_command - Chat trigger for votestop (without ! / . /).
//   Players type !stop, .stop or /stop.
//   Valid: string | Default: "stop"
wm_match_votestop_command "stop"


// ======================================================================
// Debug - Logging and diagnostics
// ======================================================================

// wm_debug_enable - Enable verbose debug logging to logs/warmod_manager.log and .dump.
//   0 = off, 1 = log SourceBans queries, Lasts, leaves and state changes.
//   Valid: 0 / 1 | Default: "0"
wm_debug_enable "0"
